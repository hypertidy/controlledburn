[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "controlledburn"
version = "0.4.0"
description = "Scanline polygon/line/point rasterization with exact coverage fractions, sparse output"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Michael Sumner", email = "mdsumner@gmail.com"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Arrow C data interface input (burn() on pyarrow/geoarrow/duckdb/polars
# geometry) needs nanoarrow; WKB-bytes and shapely paths do not.
arrow = ["nanoarrow>=0.5"]
test = ["pytest", "shapely>=2.0", "pyarrow>=14", "nanoarrow>=0.5"]

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/controlledburn"]
