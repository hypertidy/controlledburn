[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "controlledburn"
version = "0.4.0"
description = "Scanline polygon/line/point rasterization with exact coverage fractions, sparse output"
readme = "README.md"
requires-python = ">=3.9"
# PEP 639. The wheel compiles in the controlledburn Rust crate, a port
# of vendored exactextract (Apache-2.0) and fasterize-derived scanline
# code (MIT); see LICENSES/COPYRIGHTS.
# LICENSE and LICENSES/ are copies kept in sync by tools/sync-core.sh
# (license files must live inside the python/ project tree).
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{name = "Michael Sumner", email = "mdsumner@gmail.com"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Arrow C data interface input (burn() on pyarrow/geoarrow/duckdb/polars
# geometry) needs nanoarrow; WKB-bytes and shapely paths do not.
arrow = ["nanoarrow>=0.5"]
test = ["pytest", "shapely>=2.0", "pyarrow>=14", "nanoarrow>=0.5"]

[tool.maturin]
# Native module controlledburn._native, built from rust/ (the controlledburn
# crate); controlledburn._core is the Python shim over it.
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "controlledburn._native"
features = ["pyo3/extension-module"]
